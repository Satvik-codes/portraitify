<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>H2V Smart Converter</title>
<style>
:root{
  --bg:#0e1117; --panel:#161b24; --panel2:#1d2430; --line:#2a3342;
  --text:#e8edf4; --dim:#8b96a8; --accent:#4f8cff; --accent2:#37c98b;
  --err:#ff6b6b; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif;
     min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:28px 16px}
header{width:100%;max-width:980px;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
h1{font-size:21px;font-weight:650}
.badge{font-size:12px;color:var(--dim);border:1px solid var(--line);padding:5px 11px;border-radius:99px}
main{width:100%;max-width:980px;display:flex;flex-direction:column;gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.row{display:flex;gap:18px;flex-wrap:wrap}
.row>*{flex:1;min-width:220px}
label.small{display:block;font-size:12px;color:var(--dim);margin-bottom:7px;text-transform:uppercase;letter-spacing:.06em}
#drop{border:2px dashed var(--line);border-radius:var(--radius);padding:34px 20px;text-align:center;
      cursor:pointer;transition:.15s;background:var(--panel)}
#drop.over{border-color:var(--accent);background:#182031}
#drop img{max-height:180px;border-radius:8px;margin-top:12px}
#drop p{color:var(--dim)} #drop b{color:var(--text)}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;background:transparent;color:var(--dim);border:0;padding:10px 0;cursor:pointer;font-size:14px}
.seg button.on{background:var(--accent);color:#fff}
.tiers{display:flex;gap:12px}
.tier{flex:1;border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;background:var(--panel2)}
.tier.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.tier h3{font-size:14px;margin-bottom:3px} .tier span{font-size:12px;color:var(--dim)}
.tier.disabled{opacity:.45;cursor:not-allowed}
select{width:100%;background:var(--panel2);color:var(--text);border:1px solid var(--line);
       border-radius:10px;padding:10px 12px;font-size:14px}
#go{width:100%;margin-top:4px;background:var(--accent);color:#fff;border:0;border-radius:12px;
    padding:14px;font-size:16px;font-weight:600;cursor:pointer;transition:.15s}
#go:disabled{opacity:.4;cursor:not-allowed}
#barWrap{height:9px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:14px;display:none}
#bar{height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .4s}
#status{font-size:13px;color:var(--dim);margin-top:9px;min-height:19px}
#status.err{color:var(--err)}
.cmp{position:relative;width:100%;max-width:430px;margin:auto;user-select:none}
.cmp img{width:100%;display:block;border-radius:8px}
.cmp .after{position:absolute;inset:0;overflow:hidden;border-radius:8px}
.cmp .after img{position:absolute;top:0;left:0;height:100%;width:auto;max-width:none}
.cmp input[type=range]{position:absolute;left:50%;top:-40px;transform:translateX(-50%);width:70%}
.handle{position:absolute;top:0;bottom:0;width:2px;background:#fff;cursor:ew-resize}
.actions{display:flex;gap:12px;justify-content:center;margin-top:14px}
.btn{background:var(--accent);color:#fff;text-decoration:none;border:0;border-radius:10px;
     padding:11px 22px;font-size:14px;cursor:pointer}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--dim)}
#history{display:flex;gap:8px;overflow-x:auto;padding:4px 0}
#history img{height:64px;border-radius:6px;cursor:pointer;border:1px solid var(--line)}
footer{margin-top:26px;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<header><h1>H2V Smart Converter</h1><span class="badge" id="gpuBadge">checking GPU…</span></header>
<main>

<section class="card">
  <div id="drop">
    <p><b>Drop image</b>, click to browse, or paste from clipboard</p>
    <p style="font-size:12px">jpg · png · webp — original pixels are never modified</p>
  </div>
</section>

<section class="card" id="optsCard" hidden>
  <div class="row">
    <div>
      <label class="small">Target ratio</label>
      <div class="seg" id="ratioSeg"></div>
    </div>
    <div>
      <label class="small">Placement</label>
      <select id="align">
        <option value="auto">Auto (subject-aware)</option>
        <option value="top">Keep top</option>
        <option value="center">Center</option>
        <option value="bottom">Keep bottom</option>
      </select>
    </div>
  </div>
  <label class="small" style="margin-top:16px">Quality tier</label>
  <div class="tiers">
    <div class="tier on" data-tier="fast"><h3>Fast</h3><span>LaMa · ~15 s</span></div>
    <div class="tier" data-tier="quality"><h3>Quality</h3><span>PowerPaint-V2 · ~90 s</span></div>
  </div>
  <button id="go" disabled>Convert → 9:16</button>
  <div id="barWrap"><div id="bar"></div></div>
  <div id="status"></div>
</section>

<section class="card" id="resultCard" hidden>
  <div class="cmp" id="cmp">
    <img id="beforeImg" alt="original">
    <div class="after" id="afterClip"><img id="afterImg" alt="converted"></div>
    <div class="handle" id="handle"></div>
  </div>
  <input type="range" id="slider" min="0" max="100" value="55" aria-label="compare slider">
  <div class="actions">
    <a class="btn" id="dlBtn" download="vertical.png">⬇ Download PNG</a>
    <button class="btn ghost" id="againBtn">Convert another</button>
  </div>
</section>

<section class="card" id="histCard" hidden>
  <label class="small">Recent conversions</label>
  <div id="history"></div>
</section>

</main>
<footer>runs entirely on this machine · nothing leaves localhost</footer>

<script>
const $=s=>document.querySelector(s);
let file=null, ratio="9:16", tier="fast", jobId=null, poller=null, ctrl=null;

fetch("/healthz").then(r=>r.json()).then(h=>{
  $("#gpuBadge").textContent=(h.gpu||"no GPU")+" · "+(h.vram_gb||"?")+" GB";
  if(!h.fast_tier) $("#status").textContent="Fast tier unavailable - run scripts\\verify_assets.ps1",$("#status").classList.add("err");
  if(!h.quality_tier){
    const q=document.querySelector('.tier[data-tier="quality"]');
    q.classList.add("disabled");q.title="Run scripts\\download_powerpaint.ps1 to enable";
  }
});

// ratio buttons from server truth
fetch("/healthz").then(r=>r.json()).then(h=>{
  $("#ratioSeg").innerHTML="";
  h.ratios.forEach((r,i)=>{
    const b=document.createElement("button");
    b.textContent=r; if(r===ratio)b.classList.add("on");
    b.onclick=()=>{ratio=r;[...$("#ratioSeg").children].forEach(x=>x.classList.toggle("on",x===b));updGo()};
    $("#ratioSeg").appendChild(b);
  });
});

function updGo(){$("#go").textContent=`Convert → ${ratio}`;$("#go").disabled=!file;}

// ---- dropzone -------------------------------------------------------------
const dz=$("#drop");
dz.onclick=()=>{const i=document.createElement("input");i.type="file";i.accept="image/*";i.onchange=e=>pick(e.target.files[0]);i.click();};
["dragover","dragenter"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add("over")}));
["dragleave","drop"].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove("over")}));
dz.addEventListener("drop",e=>pick(e.dataTransfer.files[0]));
document.addEventListener("paste",e=>{
  const it=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith("image/"));
  if(it) pick(it.getAsFile());
});

function pick(f){
  if(!f||!/^image\//.test(f.type)) return;
  file=f;
  const im=new Image(); im.onload=()=>{
    dz.innerHTML=""; dz.appendChild(im); im.style.maxHeight="200px"; im.style.borderRadius="10px";
    $("#optsCard").hidden=false; updGo();
  }; im.src=URL.createObjectURL(f);
}

// ---- tier select ------------------------------------------------------------
document.querySelectorAll(".tier").forEach(t=>t.onclick=()=>{
  if(t.classList.contains("disabled"))return;
  tier=t.dataset.tier;
  document.querySelectorAll(".tier").forEach(x=>x.classList.toggle("on",x===t));
});

// ---- convert ----------------------------------------------------------------
$("#go").onclick=async()=>{
  if(!file)return;
  $("#go").disabled=true;$("#barWrap").style.display="block";setBar(2,"queued…");
  const fd=new FormData();fd.append("file",file);fd.append("ratio",ratio);
  fd.append("tier",tier);fd.append("align",$("#align").value);
  try{
    ctrl=new AbortController();
    const r=await fetch("/api/convert",{method:"POST",body:fd,signal:ctrl.signal});
    const j=await r.json();
    if(!r.ok){throw new Error(j.message||r.statusText)}
    jobId=j.job_id;poll(jobId,0);
  }catch(e){fail(e.message)}
};

function poll(id,n){
  poller=setTimeout(async()=>{
    try{
      const r=await fetch("/api/jobs/"+id);
      if(r.status===404)return fail("job vanished (server restarted?)");
      const j=await r.json();
      setBar(Math.max(3,j.progress),j.stage?j.stage+"…":j.status);
      if(j.status==="done"){
        setBar(100,"done in one piece ✨");showResult(j);return;
      }
      if(j.status==="failed")return fail(j.error||"unknown failure");
      poll(id,n+1);
    }catch(e){ if(n>60)return fail("lost contact with server"); poll(id,n+1);}
  }, n>30?2000:500);
}

function setBar(p,msg){$("#bar").style.width=p+"%";const s=$("#status");s.classList.remove("err");s.textContent=msg;}
function fail(m){clearTimeout(poller);$("#bar").style.width="0%";const s=$("#status");s.classList.add("err");s.textContent=m;$("#go").disabled=false;}

// ---- compare slider ----------------------------------------------------------
function showResult(j){
  const before="/api/uploads/"+j.job_id, after="/api/results/"+j.job_id;
  $("#beforeImg").src=before; $("#afterImg").src=after;
  $("#dlBtn").href=after; $("#dlBtn").setAttribute("download","vertical-"+j.job_id.slice(0,6)+".png");
  $("#resultCard").hidden=false;
  const apply=v=>{
    const box=$("#cmp"), w=box.clientWidth;
    $("#afterClip").style.width=v+"%";
    $("#afterImg").style.left="0";
    $("#handle").style.left=v+"%";
  };
  const sync=()=>apply($("#slider").value);
  $("#slider").oninput=sync; window.onresize=sync;
  // natural widths differ; scale after-image height to match box
  const bi=$("#beforeImg"), ai=$("#afterImg");
  bi.onload=ai.onload=()=>{ai.style.height=bi.clientHeight+"px";ai.style.maxWidth="none";sync();};
  setTimeout(sync,60);
  pushHistory(j.job_id,after);
}

$("#againBtn").onclick=()=>{$("#resultCard").hidden=true;setBar(0,"");$("#go").disabled=false;};

// ---- history (localStorage, last 10) -----------------------------------------
function pushHistory(id,url){
  let h=[];try{h=JSON.parse(localStorage.h2v||"[]")}catch(_){}
  h=[{id,url},...h.filter(x=>x.id!==id)].slice(0,10);
  localStorage.h2v=JSON.stringify(h);renderHistory(h);
}
function renderHistory(h){
  if(!h.length)return;
  $("#histCard").hidden=false;$("#history").innerHTML="";
  h.forEach(x=>{
    const im=new Image();im.src=x.url;im.title=x.id.slice(0,6);
    im.onerror=()=>im.replaceWith(Object.assign(document.createElement("span"),{textContent:"· expired"}));
    im.onclick=()=>{$("#beforeImg").src="/api/uploads/"+x.id;$("#afterImg").src=x.url;
      $("#dlBtn").href=x.url;$("#resultCard").hidden=false;};
    $("#history").appendChild(im);
  });
}
try{renderHistory(JSON.parse(localStorage.h2v||"[]"))}catch(_){}
</script>
</body>
</html>
